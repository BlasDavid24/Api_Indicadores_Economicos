<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfoIndicadoresEconomicos</title>
  </head>

  <body>
    <header>
      <nav
        class="navbar bg-dark border-bottom border-body"
        data-bs-theme="dark"
      >
        <div class="container-fluid">
          <a class="navbar-brand titulo_web" href="index.html"
            >Indicadores Economicos</a
          >
        </div>
      </nav>
    </header>

    <!--Titulo Princpal -->

    <div class="text-center p-3 p-md-5">
      <h1 class="display-4 mb-3 h1_Divi">
        <strong>Indicadores Económicos</strong>
      </h1>
    </div>

    <div class="col-12 col-md-8 mt-4 d-flex align-items-center gap-3 space">
      <div class="spinner-border text-danger" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="sub_ti mb-0">Indicadores Populares</p>
    </div>

    <!---- INDICADORES ECONOMICOS -->

    <div class="container mt-5 mb-5">
      <div class="row row-cols-1 row-cols-md-4 g-4">
        <!-- Dólar -->
        <div class="col mb">
          <div class="card h-60 text-center diseño_card border-5 border-black">
            <div class="card-body mb">
              <i class="fa-solid fa-dollar-sign fa-10x mt-2 mb-4"></i>
              <h5 class="card-title fw-bold">Dólar</h5>
              <div
                id="div_hide"
                class="letra-metal border border-black text-white rounded p-2 text-center mb-3"
                style="display: none"
              >
                <h6 id="valor-dolar" class="mb-0 fw-bold"></h6>
              </div>
              <div class="form-check form-switch d-flex justify-content-center">
                <input
                  class="form-check-input"
                  type="checkbox"
                  role="switch"
                  id="toggle-dolar"
                />
              </div>
            </div>

            <!--Muestra de graficos---->

            <div class="col">
              <div
                class="card h-60 text-center diseño_card border-1' border-black d-flex justify-content-center align-items-center"
              >
                <button
                  class="btn btn-outline-dark fw-bold btn-mostrar mt-2 mb-2"
                  data-indicador="dolar"
                >
                  GRAFICO
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Euro -->
        <div class="col">
          <div class="card h-60 text-center diseño_card border-5 border-black">
            <div class="card-body">
              <i class="fa-solid fa-euro-sign fa-10x mt-2 mb-4"></i>
              <h5 class="card-title fw-bold">Euro</h5>
              <div
                id="div_hide2"
                class="letra-metal border border-black text-white rounded p-2 text-center mb-3"
                style="display: none"
              >
                <h6 id="valor-euro" class="mb-0 fw-bold"></h6>
              </div>
              <div class="form-check form-switch d-flex justify-content-center">
                <input
                  class="form-check-input"
                  type="checkbox"
                  role="switch"
                  id="toggle-euro"
                />
              </div>
            </div>

            <!--Muestra de graficos---->

            <div class="col">
              <div
                class="card h-60 text-center diseño_card border-1' border-black d-flex justify-content-center align-items-center"
              >
                <button
                  class="btn btn-outline-dark fw-bold btn-mostrar mt-2 mb-2"
                  data-indicador="euro"
                >
                  GRAFICO
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Bitcoin -->
        <div class="col">
          <div class="card h-60 text-center diseño_card border-5 border-black">
            <div class="card-body">
              <i class="fa-solid fa-bitcoin-sign fa-10x mt-2 mb-4"></i>
              <h5 class="card-title fw-bold">Bitcoin</h5>
              <div
                id="div_hide3"
                class="letra-metal border border-black text-white rounded p-2 text-center mb-3"
                style="display: none"
              >
                <h6 id="valor-bitcoin" class="mb-0 fw-bold"></h6>
              </div>
              <div class="form-check form-switch d-flex justify-content-center">
                <input
                  class="form-check-input"
                  type="checkbox"
                  role="switch"
                  id="toggle-bitcoin"
                />
              </div>
            </div>

            <!--Muestra de graficos---->

            <div class="col">
              <div
                class="card h-60 text-center diseño_card border-1' border-black d-flex justify-content-center align-items-center"
              >
                <button
                  class="btn btn-outline-dark fw-bold btn-mostrar mt-2 mb-2"
                  data-indicador="bitcoin"
                >
                  GRAFICO
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- UF -->
        <div class="col">
          <div class="card h-60 text-center diseño_card border-5 border-black">
            <div class="card-body">
              <div class="uf-icon mb-3">UF</div>
              <h5 class="card-title fw-bold">UF</h5>
              <div
                id="div_hide4"
                class="letra-metal border border-black text-white rounded p-2 text-center mb-3"
                style="display: none"
              >
                <h6 id="valor-uf" class="mb-0 fw-bold"></h6>
              </div>
              <div class="form-check form-switch d-flex justify-content-center">
                <input
                  class="form-check-input"
                  type="checkbox"
                  role="switch"
                  id="toggle-uf"
                />
              </div>
            </div>

            <!--Muestra de graficos---->

            <div class="col">
              <div
                class="card h-60 text-center diseño_card border-1' border-black d-flex justify-content-center align-items-center"
              >
                <button
                  class="btn btn-outline-dark fw-bold btn-mostrar mt-2 mb-2"
                  data-indicador="uf"
                >
                  GRAFICO
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!------Se muestran las graficas-->

    <div
      id="container-graf"
      class="rounded p-4 mt-4 div-graf"
    >
      <div class="d-flex justify-content-between align-items-center mb-3">
        <button id="btn-cerrar" class="btn btn-outline-danger border-3 fw-bolder">
          Cerrar 
        </button>
        <button id="btn-actualizar" class="btn btn-outline-primary border-3 fw-bolder btn-fondo">
          Actualizar
        </button>
      </div>
      <canvas id="indicador-Eco"></canvas>
    </div>

    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
    <script src="./assets/js/script.js"></script>
  </body>
</html>
